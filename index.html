<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./src/images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>NFT Card</title>
</head>
<body>
    <main>
        <div class="card">

            <a href="#" class="image-link">
                <img class="image-equilibrium" src="./src/images/image-equilibrium.jpg" alt="nft-equilibrium">
            </a>
            
            <h1><a class="link-titulo" href="#">Equilibrium #3429</a></h1>

            <p class="description">Our Equilibrium collection promotes balance and calm.</p>

            <div class="about">
                <p class="price">0.041 ETH</p>
                <p class="days-left">3 days left</p>
            </div>

            <div class="creator">
                <img class="image-creator" src="./src/images/image-avatar.png" alt="avatar">
                <p class="name-creator">Creation of <a class="link-name-creator" href="#">Jules Wyvern</a></p>
            </div>
        </div>
    </main>
</body>
</html>
